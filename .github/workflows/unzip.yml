name: Unzip and Overwrite Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find, Unzip, and Overwrite Files
        run: |
          # 1. Automatically find the first .zip file in the repository
          ZIP_FILE=$(find . -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Error: No .zip file found anywhere in the repository."
            exit 1
          fi

          echo "📦 Found zip file: $ZIP_FILE"

          # 2. Ensure unzip utility is installed
          if ! command -v unzip &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y unzip
          fi

          # 3. Unzip the file to the repository root (.)
          # -o = Overwrite existing files without prompting (prevents errors)
          # -q = Quiet mode
          echo "📦 Extracting $ZIP_FILE to repository root..."
          unzip -o -q "$ZIP_FILE" -d "."

          echo "✅ Unzipping completed successfully!"

      - name: Commit and Push Changes (Bypassing .gitignore)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Force add all files, bypassing .gitignore rules
          git add -f -A .

          # Commit and push if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-unzipped and overwrote files via GitHub Actions"
            git push
            echo "✅ Changes pushed to the repository."
          else
            echo "ℹ️ No changes to commit (files were already up to date)."
          fi
