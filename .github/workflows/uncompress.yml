name: Uncompress Repository Files

on:
  workflow_dispatch:
  push:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip tar gzip

      - name: Extract compressed files
        run: |
          find . -type f \( \
            -name "*.zip" -o \
            -name "*.tar.gz" -o \
            -name "*.tgz" -o \
            -name "*.gz" \
          \) | while read file; do

            echo "Extracting: $file"

            case "$file" in
              *.zip)
                unzip -o "$file" -d "$(dirname "$file")"
                ;;

              *.tar.gz|*.tgz)
                tar -xzf "$file" -C "$(dirname "$file")"
                ;;

              *.gz)
                gunzip -k "$file"
                ;;
            esac

          done

      - name: Commit extracted files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .
          git commit -m "Auto extract compressed files" || echo "No changes"
          git push
