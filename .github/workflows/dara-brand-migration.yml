name: Lovable To Dara Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Replace Lovable Branding With Dara
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep


      - name: Scan old branding
        run: |
          echo "Searching for Lovable references..."

          rg -i "lovable" \
          --hidden \
          --glob '!.git/**' \
          --glob '!node_modules/**' || true


      - name: Replace text references
        run: |
          echo "Replacing text..."

          find . \
          -type f \
          ! -path "./.git/*" \
          ! -path "./node_modules/*" \
          ! -name "*.png" \
          ! -name "*.jpg" \
          ! -name "*.jpeg" \
          ! -name "*.webp" \
          ! -name "*.gif" \
          ! -name "*.ico" \
          -exec sed -i \
          -e 's/Lovable/Dara/g' \
          -e 's/lovable/dara/g' \
          -e 's/LOVABLE/DARA/g' \
          {} +

          echo "Text replacement finished."


      - name: Rename files and folders
        run: |
          echo "Renaming files..."

          find . \
          -depth \
          -iname "*lovable*" \
          | while read old
          do

            new=$(echo "$old" | \
            sed \
            -e 's/Lovable/Dara/g' \
            -e 's/lovable/dara/g' \
            -e 's/LOVABLE/DARA/g')

            if [ "$old" != "$new" ]; then
              echo "Rename:"
              echo "$old"
              echo "to"
              echo "$new"

              mv "$old" "$new"
            fi

          done


      - name: Validate JSON files
        run: |
          echo "Checking JSON files..."

          python3 - <<'PY'
import json
import os
import sys

errors = []

for root, dirs, files in os.walk("."):

    if ".git" in root or "node_modules" in root:
        continue

    for file in files:

        if file.endswith(".json"):

            path = os.path.join(root, file)

            try:
                with open(path, "r", encoding="utf-8") as f:
                    json.load(f)

            except Exception as e:
                errors.append(
                    f"{path}: {e}"
                )


if errors:

    print("JSON errors found:")

    for error in errors:
        print(error)

    sys.exit(1)


print("All JSON files are valid.")
PY


      - name: Check remaining Lovable references
        run: |
          echo "Final search..."

          if rg -i "lovable" \
          --hidden \
          --glob '!.git/**' \
          --glob '!node_modules/**'
          then
            echo "Old Lovable references still exist."
            exit 1
          else
            echo "Migration completed successfully."
          fi


      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit \
          -m "Replace Lovable branding with Dara" \
          || echo "No changes detected"


      - name: Push changes
        run: |
          git push
